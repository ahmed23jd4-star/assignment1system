<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
    <title>contact</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.</p>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="text">number:</label>
                <input type="text" id="text" name="text" required>

                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required> 

                <label>Gender:</label>
            <div class="radio-group">
         <div class="radio-option">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
         </div>
    
         <div class="radio-option">
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            </div>
<hr> 
                <label>your interests</label>
                <div class="checkbox-group">

                <input type="checkbox" id="html" name="intersted" value="html">
                <label for="html">html</label>
                <input type="checkbox" id="css" name="intersted" value="css">
                <label for="css">css</label>
                <input type="checkbox" id="javascript" name="intersted" value="javascript">
                <label for="javascript">javascript</label>
                </div>
<hr>

                <label>your subject</label>
                <select id="dropdown" name="dropdown">
                    <option value="cs305">cs305</option>
                    <option value="cs309">cs309</option>
                    <option value="cs307">cs307</option>
                </select>
<hr>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <hr>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p> 
    </footer>
</body>
</html>
